name: Go CI/CD Pipeline

on:
  push:
    branches: [ mainGit, main ]
  pull_request:
    branches: [ mainGit, main ]

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run unit tests
      run: go test ./tests -v
    
    - name: Run tests with coverage
      run: go test ./tests -coverprofile=coverage.out
    
    - name: Display coverage
      run: go tool cover -func=coverage.out

  # Job 2: Build Application
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'
    
    - name: Build application
      run: go build -v -o go-task-api cmd/api/main.go
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: go-task-api
        path: go-task-api

  # Job 3: Docker Build
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t go-task-api:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8080:8080 \
          -e DATABASE_URL="postgres://postgres:postgres@host.docker.internal:5432/tasks_db?sslmode=disable" \
          -e PORT=8080 \
          go-task-api:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8080/health || exit 1

  # Job 4: Code Quality
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'
    
    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted!"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Run go vet
      run: go vet ./...